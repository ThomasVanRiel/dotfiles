# xdg-desktop-portal backend selection under niri.
#
# The FIRST file found wins outright (no merging across files):
#   ~/.config/xdg-desktop-portal/niri-portals.conf   <- this file
#   ~/.config/xdg-desktop-portal/portals.conf        <- symlink to this file
#   /usr/share/xdg-desktop-portal/niri-portals.conf
# Interfaces not listed here fall back to `default`.

[preferred]
default=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.ScreenCast=gnome
# yazi in a kitty window instead of the dolphin/GTK dialog; gnome is the
# fallback if xdg-desktop-portal-termfilechooser is not running.
org.freedesktop.impl.portal.FileChooser=termfilechooser;gnome
