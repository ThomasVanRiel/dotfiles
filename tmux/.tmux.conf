# ==========================
# General Settings
# ==========================

# Change prefix from Ctrl+b to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 50000

# Faster escape time (better for vim/neovim)
set -sg escape-time 10

# Enable focus events
set -g focus-events on

# Status messages visible for 4s (default: 750ms)
set -g display-time 4000

# Refresh status bar every 5s (default: 15s)
set -g status-interval 5

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ==========================
# Key Bindings
# ==========================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Restore terminal clear (C-l is captured by vim-tmux-navigator)
bind l send-keys 'C-l'

# Mark/unmark current pane (marked pane = target for join/swap operations)
bind m select-pane -m

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -f -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"
bind C new-session

# Alt + arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Reorder windows with prefix + Left/Right
bind Left swap-window -t -1 \; select-window -t -1
bind Right swap-window -t +1 \; select-window -t +1

# Window bookmarks (tmux-mark)
bind M run-shell "~/.tmux/scripts/tmux-mark.sh toggle"
bind "`" run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind Tab run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind BTab run-shell "~/.tmux/scripts/tmux-mark.sh prev"

# Switch windows with prefix + C-h/C-l (home row alternative)
bind C-h previous-window
bind C-l next-window

# Open scrollback buffer in $EDITOR
bind-key C-e run-shell "~/.tmux/scripts/tmux-edit-scrollback.sh"

# Popup border colors (Catppuccin Mocha palette)
# Requires tmux 3.3+ for -T (title), -S (border/title style)
# Note: -s sets the popup content style (text color etc), -S sets border/title only
set -g @popup_lazygit_color "#89b4fa"
set -g @popup_claude_color "#fab387"
set -g @popup_scratchpad_color "#a6e3a1"

# Open lazygit in a popup
# -d: start in current pane's directory
# -E: close popup when command exits
bind g run-shell '\
  COLOR="$(tmux show -gv @popup_lazygit_color)"; \
  tmux display-popup -T " 󰊢 Lazygit " -S "fg=$COLOR" -d "#{pane_current_path}" -w 90% -h 90% -E lazygit'

# Open claude session in a popup (reattaches if already running)
# Derives a unique session name from the current directory hash
# so each project gets its own persistent claude session
# has-session: reuse existing session if it exists, otherwise create it
# new-session -d: create detached so we can configure it before attaching
# set-option status off: hide the status bar inside the popup session
# display-popup -E: close popup when the session detaches or exits
bind y run-shell '\
  COLOR="$(tmux show -gv @popup_claude_color)"; \
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  { tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude" && \
    tmux set-option -t "$SESSION" status off; }; \
  tmux display-popup -T " 󰭻 Claude" -S "fg=$COLOR" -w 80% -h 90% -E "tmux attach-session -t $SESSION"'

# Open IPython scratchpad in a popup (reattaches if already running)
# Setup runs inside the popup so progress is visible on first use
# See ~/.tmux/scripts/scratchpad.sh for venv bootstrap and IPython config
bind p run-shell '\
  COLOR="$(tmux show -gv @popup_scratchpad_color)"; \
  SESSION="scratchpad"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  { tmux new-session -d -s "$SESSION" "$HOME/.tmux/scripts/scratchpad.sh" && \
    tmux set-option -t "$SESSION" status off && \
    tmux set-option -t "$SESSION" -p pane-border-status off; }; \
  tmux display-popup -T "  Scratchpad " -S "fg=$COLOR" -w 80% -h 90% -E "tmux attach-session -t $SESSION"'

# ==========================
# Copy Mode (Vim-style)
# ==========================

setw -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Vim-style selection and copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel


# ==========================
# Plugins
# ==========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/tmux-mark.sh save'
set -g @resurrect-hook-pre-restore-pane-processes '~/.tmux/scripts/tmux-mark.sh restore'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ==========================
# Status Bar
# ==========================
# Uncomment one line to select the active statusbar, then reload (prefix + r).

# source-file ~/.tmux/statusbars/default.conf
source-file ~/.tmux/statusbars/custom.conf

# ==========================
# Initialize TPM (keep at bottom)
# ==========================

run '~/.tmux/plugins/tpm/tpm'
