# ==========================
# General Settings
# ==========================

# Ensure user-local paths are always available regardless of how tmux was started.
# tmux inherits the environment of the process that launched it, which may be
# minimal (e.g. when restored by tmux-continuum on login). Prepending here
# guarantees tools installed in ~/.local/bin and ~/.cargo/bin are always found.
set-environment -g PATH "$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

# WSL2: expose WSLg's Wayland socket to all sessions/popups so wl-copy works.
# WAYLAND_DISPLAY is set per login session and not always inherited by the tmux server.
run-shell 'tmux set-environment -g WAYLAND_DISPLAY "${WAYLAND_DISPLAY:-wayland-0}"'

# Change prefix: C-a 
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 50000

# Faster escape time (better for vim/neovim)
set -sg escape-time 10

# Enable focus events
set -g focus-events on

# Status messages visible for 4s (default: 750ms)
set -g display-time 4000

# Refresh status bar every 5s (default: 15s)
set -g status-interval 5

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Use OSC 52 to set the clipboard (works in WezTerm and other modern terminals)
set -s set-clipboard on
set -as terminal-features "*:clipboard"

# Explicitly set cursor colour on every pane display to prevent OSC sequences
# from leaking green (#A6E3A1) into the cursor after pane close
set -g cursor-colour "#CDD6F4"
set -g prompt-cursor-colour "#CDD6F4"


# ==========================
# Key Bindings
# ==========================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Restore terminal clear (C-l is captured by vim-tmux-navigator)
bind l send-keys 'C-l'

# Mark/unmark current pane (marked pane = target for join/swap operations)
bind m select-pane -m

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -f -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"
bind C new-session

# Alt + arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Reorder windows with prefix + Left/Right
bind Left swap-window -t -1 \; select-window -t -1
bind Right swap-window -t +1 \; select-window -t +1

# Window bookmarks (tmux-mark)
bind M run-shell "~/.tmux/scripts/tmux-mark.sh toggle"
bind "`" run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind Tab run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind BTab run-shell "~/.tmux/scripts/tmux-mark.sh prev"

# Switch windows with prefix + C-h/C-l (home row alternative)
bind C-h previous-window
bind C-l next-window

# Open scrollback buffer in $EDITOR
bind-key C-e run-shell "~/.tmux/scripts/tmux-edit-scrollback.sh"

# Popup border colors (Catppuccin Mocha palette)
# Requires tmux 3.3+ for -T (title), -S (border/title style)
# Note: -s sets the popup content style (text color etc), -S sets border/title only
set -g @popup_lazygit_color "#f9e2af"
set -g @popup_claude_color "#fab387"
set -g @popup_scratchpad_color "#a6e3a1"
set -g @popup_files_color "#89b4fa"

# Open lazygit in a popup
# -d: start in current pane's directory
# -E: close popup when command exits
bind g run-shell '\
  COLOR="$(tmux show -gv @popup_lazygit_color)"; \
  tmux display-popup -T " 󰊢 Lazygit " -S "fg=$COLOR" -d "#{pane_current_path}" -w 90% -h 90% -E lazygit'

# Open claude session in a popup (reattaches if already running)
# Derives a unique session name from the current directory hash
# so each project gets its own persistent claude session
# has-session: reuse existing session if it exists, otherwise create it
# new-session -d: create detached so we can configure it before attaching
# set-option status off: hide the status bar inside the popup session
# display-popup -E: close popup when the session detaches or exits
bind y run-shell '\
  COLOR="$(tmux show -gv @popup_claude_color)"; \
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  { tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude" && \
    tmux set-option -t "$SESSION" status off && \
    tmux set-option -t "$SESSION" -p pane-border-status off; }; \
  tmux display-popup -T " 󰭻 Claude" -S "fg=$COLOR" -w 80% -h 90% -E "tmux attach-session -t $SESSION"'

# Open IPython scratchpad in a popup (reattaches if already running)
# Setup runs inside the popup so progress is visible on first use
# See ~/.tmux/scripts/scratchpad.sh for venv bootstrap and IPython config
bind p run-shell '\
  COLOR="$(tmux show -gv @popup_scratchpad_color)"; \
  SESSION="scratchpad"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  { tmux new-session -d -s "$SESSION" "$HOME/.tmux/scripts/scratchpad.sh" && \
    tmux set-option -t "$SESSION" status off && \
    tmux set-option -t "$SESSION" -p pane-border-status off; }; \
  tmux display-popup -T "  Scratchpad " -S "fg=$COLOR" -w 80% -h 90% -E "tmux attach-session -t $SESSION"'

# Pick files with fzf and type them into the current pane (Tab multi-selects).
# The pane id is passed through so the popup knows where to send the text, and
# -d starts fzf in the pane's cwd so the paths come out relative.
#   prefix + f  ->  @path refs, for Claude Code
#   prefix + F  ->  bare paths, for anything else
bind f run-shell '\
  COLOR="$(tmux show -gv @popup_files_color)"; \
  tmux display-popup -T "  Files @ " -S "fg=$COLOR" -d "#{pane_current_path}" -w 80% -h 80% -E "~/.tmux/scripts/fzf-insert-files.sh #{pane_id} @"'

bind F run-shell '\
  COLOR="$(tmux show -gv @popup_files_color)"; \
  tmux display-popup -T "  Files " -S "fg=$COLOR" -d "#{pane_current_path}" -w 80% -h 80% -E "~/.tmux/scripts/fzf-insert-files.sh #{pane_id}"'

# ==========================
# Copy Mode (Vim-style)
# ==========================

setw -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Vim-style selection and copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null; true"
bind -T copy-mode-vi Escape send -X cancel


# ==========================
# Plugins
# ==========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/tmux-mark.sh save'
set -g @resurrect-hook-pre-restore-pane-processes '~/.tmux/scripts/tmux-mark.sh restore'
set -g @resurrect-hook-post-restore-all 'tmux kill-session -t scratchpad 2>/dev/null; true'
#set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ==========================
# Status Bar
# ==========================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

run ~/.tmux/plugins/tmux/catppuccin.tmux

# Tmux status bar base
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"
set -ug status 2
set -gu status-format[1] "#[fill=#{@thm_bg}]"

# Pane borders
setw -g pane-border-status top
# Unset any hook set by default.conf, use format string for per-pane copy mode indicator
set-hook -ug pane-mode-changed
setw -g pane-border-format "#{?pane_in_mode,#[fg=#cba6f7] 󰆿 COPY ,}"
setw -g pane-border-lines single
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"

# Window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
#set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_rosewater}" # tint the previously active window to distinguish it from other inactive windows
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "fg=#{@thm_peach},bold"

# Status left
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold] 󰏘 #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}] 󰏘 #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}] 󰆍 #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰉋 #(~/.tmux/scripts/trunc-path.sh #{q:pane_current_command} #{q:pane_current_path} #{q:pane_title}) "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#(~/.tmux/scripts/git-status.sh #{q:pane_current_path} #{q:pane_current_command})"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag, │,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_peach}]#{?window_zoomed_flag, 󰍉 zoom ,}"

# Status right:
#   always     → lang versions + active venv (@venv set per-pane by shell precmd)
#   non-SSH    → conditional │ via #{?#{@env_has_content},...} (set by env-status.sh)
#   SSH        → uptime
#   Hyprland   → no datetime (waybar has the clock)
#   other      → datetime
set -g status-right ""
# Battery (only visible when a battery is detected, e.g. on a laptop)
set -ga status-right "#[bg=#{@thm_bg},fg=#{?#{@battery_critical},#{@thm_red},#{@thm_teal}}]#(~/.tmux/scripts/battery-status.sh) "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?#{@battery_has_content},│,}"
# Note: #{q:@venv} — the q: flag is required; without it, values like (venv) are
# interpreted as a subshell by the shell running the #() command, silently breaking it.
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] #(~/.tmux/scripts/env-status.sh #{pane_id} #{q:pane_current_path} #{q:pane_current_command} #{q:@venv}) "
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]#{?#{@env_has_content},│,}#[fg=#{@thm_overlay_2}] 󰔚  #(uptime -p | sed 's/up //') "
} {
  if-shell '[ -z "$HYPRLAND_INSTANCE_SIGNATURE" ]' {
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]#{?#{@env_has_content},│,}#[fg=#{@thm_blue}] 󰭦 %A %d %B 󰅐 %H:%M "
  }
}

# ==========================
# Initialize TPM (keep at bottom)
# ==========================

run '~/.tmux/plugins/tpm/tpm'

# Override catppuccin's teal message-style (used for confirmations, prompts)
set -g message-style "fg=#{@thm_text},bg=#{@thm_surface_1}"
set -g message-command-style "fg=#{@thm_text},bg=#{@thm_surface_1}"
