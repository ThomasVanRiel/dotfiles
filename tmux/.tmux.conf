# ==========================
# General Settings
# ==========================

# Change prefix from Ctrl+b to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 50000

# Faster escape time (better for vim/neovim)
set -sg escape-time 10

# Enable focus events
set -g focus-events on

# Status messages visible for 4s (default: 750ms)
set -g display-time 4000

# Refresh status bar every 5s (default: 15s)
set -g status-interval 5

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ==========================
# Key Bindings
# ==========================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Restore terminal clear (C-l is captured by vim-tmux-navigator)
bind l send-keys 'C-l'

# Mark/unmark current pane (marked pane = target for join/swap operations)
bind m select-pane -m

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -f -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"
bind C new-session

# Alt + arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Reorder windows with prefix + Left/Right
bind Left swap-window -t -1 \; select-window -t -1
bind Right swap-window -t +1 \; select-window -t +1

# Window bookmarks (tmux-mark)
bind M run-shell "~/.tmux/scripts/tmux-mark.sh toggle"
bind "`" run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind Tab run-shell "~/.tmux/scripts/tmux-mark.sh next"
bind BTab run-shell "~/.tmux/scripts/tmux-mark.sh prev"

# Switch windows with prefix + C-h/C-l (home row alternative)
bind C-h previous-window
bind C-l next-window

# Open scrollback buffer in $EDITOR
bind-key C-e run-shell "~/.tmux/scripts/tmux-edit-scrollback.sh"

# Open lazygit in a popup
bind g display-popup -e TERM=xterm-256color -d "#{pane_current_path}" -w 90% -h 90% -E lazygit

# Open claude session in a popup (reattaches if already running)
# Derive a unique session name from the current directory hash
# so each project gets its own persistent claude session
bind y run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  { tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude" && \
    tmux set-option -t "$SESSION" status off; }; \
  tmux display-popup -w 80% -h 90% -E "tmux attach-session -t $SESSION"'
  # has-session: reuse existing session if it exists, otherwise create it
  # new-session -d: create detached so we can configure it before attaching
  # set-option status off: hide the status bar inside the claude session
  # display-popup -E: open popup and close it automatically when session exits


# ==========================
# Copy Mode (Vim-style)
# ==========================

setw -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Vim-style selection and copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# Highlight pane border in mauve when in copy mode
set-hook -g pane-mode-changed \
  'if -F "#{pane_in_mode}" \
    "set -p pane-active-border-style fg=#cba6f7" \
    "set -pu pane-active-border-style"'

# ==========================
# Plugins
# ==========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/tmux-mark.sh save'
set -g @resurrect-hook-pre-restore-pane-processes '~/.tmux/scripts/tmux-mark.sh restore'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ==========================
# Catppuccin Configuration
# ==========================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?window_zoomed_flag, 󰍉,}#{?#{@marked}, ●,}"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰍉,}#{?#{@marked}, ●,}"
set -g @catppuccin_window_current_number "#I"

set -g @catppuccin_date_time_text " %A %d %B %H:%M"
set -g @catppuccin_status_right_separator "#[fg=#{@thm_surface_0},bg=default] "

# Load catppuccin (must be before status bar config)
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{?window_zoomed_flag,#[bg=#f38ba8 fg=#1e1e2e] 󰍉 ZOOM ,}#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ==========================
# Initialize TPM (keep at bottom)
# ==========================

run '~/.tmux/plugins/tpm/tpm'
