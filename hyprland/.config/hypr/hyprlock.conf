# Hyprlock Configuration
# Location: ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /tmp/lockscreen.png
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1
    brightness = 0.8
    vibrancy = 0
    vibrancy_darkness = 0
}

shape {
    monitor =
    size = 400, 350
    color = rgba(0, 0, 0, 0.6)
    rounding = 15
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(cdd6f4)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}
