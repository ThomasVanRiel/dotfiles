# Hyprland Configuration
# Custom config to layer on top of CachyOS defaults
# Location: ~/.config/hypr/hyprland.conf

# ========================================
# MONITORS
# ========================================
# Ultrawide 3440x1440 @ 165Hz
monitor=,3440x1440@165,auto,1

# ========================================
# ENVIRONMENT VARIABLES
# ========================================
env = XCURSOR_SIZE,18
env = XCURSOR_THEME,catppuccin-mocha-light-cursors
env = QT_QPA_PLATFORMTHEME,kde

# NVIDIA specific
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# Firefox Wayland
env = MOZ_ENABLE_WAYLAND,1

# ========================================
# MISC
# ========================================
misc {
    force_default_wallpaper = 0
}

# ========================================
# STARTUP
# ========================================
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = ulauncher --hide-window
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gnome-keyring-daemon --start --components=secrets

# ========================================
# INPUT
# ========================================
input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

# ========================================
# SOURCED CONFIGS
# ========================================
source = ~/.config/hypr/mocha.conf
source = ~/.config/hypr/layouts.conf
source = ~/.config/hypr/decorations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
