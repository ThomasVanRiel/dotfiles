# ========================================
# GENERAL (borders)
# ========================================
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = $blue
    col.inactive_border = $surface0
}

# ========================================
# DECORATION
# ========================================
decoration {
    rounding = 5

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba($crustAlpha99)
    }
    dim_special = 0.4
}

# ========================================
# GROUP (tabbed windows)
# ========================================
group {
    col.border_active = $blue
    col.border_inactive = $surface0

    groupbar {
        col.active = $blue
        col.inactive = $surface1
    }
}

# ========================================
# ANIMATIONS (Fast)
# ========================================
animations {
    enabled = true

    bezier = snappy, 0.4, 0.0, 0.2, 1.0

    animation = windows, 1, 3, snappy
    animation = windowsOut, 1, 3, snappy, popin 80%
    animation = border, 1, 5, snappy
    animation = borderangle, 1, 4, snappy
    animation = fade, 1, 3, snappy
    animation = workspaces, 1, 3, snappy

    animation = specialWorkspace, 1, 3, snappy, slidefade, 0
}
