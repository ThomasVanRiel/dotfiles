# ========================================
# WINDOW RULES
# ========================================

# zen-browser — float, centered, 60% of 3440px ultrawide
windowrule {
    name = zen-browser-float
    match:class = ^(zen-browser)$
    float = yes
    size = 2064 1350
    center = yes
    workspace = 1 silent
}

# kitty — workspace 2
windowrule {
    name = kitty-workspace
    match:class = ^(kitty)$
    workspace = 2 silent
}

# Float dialogs
windowrule {
    name = bitwarden-float
    match:class = ^(Bitwarden)$
    float = yes
}

windowrule {
    name = pavucontrol-float
    match:class = ^(pavucontrol)$
    float = yes
}

windowrule {
    name = nm-editor-float
    match:class = ^(nm-connection-editor)$
    float = yes
}

windowrule {
    name = open-file-dialog
    match:title = ^(Open File)$
    float = yes
}

windowrule {
    name = save-file-dialog
    match:title = ^(Save File)$
    float = yes
}

# Ulauncher
windowrule {
    name = ulauncher-rules
    match:class = ^(ulauncher)$
    float = yes
    no_blur = yes
    border_size = 0
    no_shadow = yes
}

windowrule {
    name = ulauncher-prefs-float
    match:title = ^(Ulauncher Preferences)$
    float = yes
}

# Gaming — workspace 3, fullscreen, no blur
windowrule {
    name = steam-app-gaming
    match:class = ^(steam_app_.*)$
    no_blur = yes
    fullscreen = yes
    workspace = 3 silent
}

windowrule {
    name = steam-workspace
    match:class = ^(Steam)$
    workspace = 3 silent
}

windowrule {
    name = steam-lowercase-workspace
    match:class = ^(steam)$
    workspace = 3 silent
}

windowrule {
    name = lutris-workspace
    match:class = ^(lutris)$
    workspace = 3 silent
}

windowrule {
    name = heroic-workspace
    match:class = ^(heroic)$
    workspace = 3 silent
}

windowrule {
    name = gamescope-workspace
    match:class = ^(gamescope)$
    workspace = 3 silent
}

windowrule {
    name = factorio-workspace
    match:class = ^(Factorio)$
    workspace = 3 silent
}

# VSCode — workspace 4
windowrule {
    name = vscode-url-handler
    match:class = ^(code-url-handler)$
    workspace = 4 silent
}

windowrule {
    name = vscode-capital
    match:class = ^(Code)$
    workspace = 4 silent
}

windowrule {
    name = vscode-lowercase
    match:class = ^(code)$
    workspace = 4 silent
}

# Python matplotlib figures
windowrule {
    name = matplotlib-float
    match:class = ^(python3?)$
    match:title = ^(Figure)
    float = yes
}
