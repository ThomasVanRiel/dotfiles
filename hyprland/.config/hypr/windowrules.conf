# ========================================
# WINDOW RULES
# ========================================

# zen-browser — float, centered, 60% of 3440px ultrawide
windowrulev2 = float, class:^(zen-browser)$
windowrulev2 = size 2064 1350, class:^(zen-browser)$
windowrulev2 = center, class:^(zen-browser)$
windowrulev2 = workspace 1 silent, class:^(zen-browser)$

# kitty — workspace 2
windowrulev2 = workspace 2 silent, class:^(kitty)$

# Float dialogs
windowrulev2 = float, class:^(Bitwarden)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$

# Ulauncher
windowrulev2 = float, class:^(ulauncher)$
windowrulev2 = noblur, class:^(ulauncher)$
windowrulev2 = noborder, class:^(ulauncher)$
windowrulev2 = noshadow, class:^(ulauncher)$
windowrulev2 = float, title:^(Ulauncher Preferences)$

# Gaming — workspace 3, fullscreen, no blur
windowrulev2 = noblur, class:^(steam_app_.*)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$
windowrulev2 = workspace 3 silent, class:^(steam_app_.*)$
windowrulev2 = workspace 3 silent, class:^(Steam)$
windowrulev2 = workspace 3 silent, class:^(steam)$
windowrulev2 = workspace 3 silent, class:^(lutris)$
windowrulev2 = workspace 3 silent, class:^(heroic)$
windowrulev2 = workspace 3 silent, class:^(gamescope)$
windowrulev2 = workspace 3 silent, class:^(Factorio)$

# VSCode — workspace 4
windowrulev2 = workspace 4 silent, class:^(code-url-handler)$
windowrulev2 = workspace 4 silent, class:^(Code)$
windowrulev2 = workspace 4 silent, class:^(code)$

# Python matplotlib figures
windowrulev2 = float, class:^(python3?)$, title:^(Figure)
