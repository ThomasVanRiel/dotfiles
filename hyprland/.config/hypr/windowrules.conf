# ========================================
# WINDOW RULES
# ========================================

# Float certain windows
windowrule = match:class ^(Bitwarden)$, float 1
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:title ^(Open File)$, float 1
windowrule = match:title ^(Save File)$, float 1

# Ulauncher
windowrule = match:class ^(ulauncher)$, decorate 0, no_blur 1
windowrule = match:title ^(Ulauncher Preferences)$, float 1

# Gaming - disable blur for games and open in workspace 3
windowrule = match:class ^(steam_app_), no_blur 1
windowrule = match:class ^(steam_app_), fullscreen 1
windowrule = match:class ^(steam_app_), workspace 3
windowrule = match:class ^(Steam)$, workspace 3
windowrule = match:class ^(steam)$, workspace 3
windowrule = match:class ^(lutris)$, workspace 3
windowrule = match:class ^(heroic)$, workspace 3
windowrule = match:class ^(gamescope)$, workspace 3
windowrule = match:class ^(factorio)$, workspace 3
windowrule = match:class ^(Factorio)$, workspace 3

# VSCode - open in workspace 4
windowrule = match:class ^(code-url-handler)$, workspace 4
windowrule = match:class ^(Code)$, workspace 4
windowrule = match:class ^(code)$, workspace 4
windowrule = match:class ^(python3?)$ match:initialTitle ^(Figure), float 1


