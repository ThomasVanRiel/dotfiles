# Overrides yazi's default `edit` opener, which falls back to `vi` when
# $EDITOR is unset. $EDITOR only comes from ~/.zshrc, so a yazi that was not
# started from an interactive shell -- the tmux popup (prefix + y), Super+E in
# niri, the file-picker portal -- has none, and `vi` is not installed: opening
# a file or bulk-renaming died with exit 127. Fall back to nvim instead.
[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
]

# git.yazi: status signs in the file list (set up in init.lua).
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# repo-status.yazi: branch and status next to directories that are repositories.
[[plugin.prepend_fetchers]]
url = "*/"
run = "repo-status"
group = "repo-status"

[[plugin.prepend_previewers]]
url = "*/"
run = "repo-status"
