# Prepended to yazi's defaults, so every built-in key still works.
#
# `z` runs the bundled fzf plugin, which lists whatever $FZF_DEFAULT_COMMAND
# gives it -- files and dirs both, since ~/.zshrc sets `fd --type f --type d`.
# It reveals a file, or cds into a directory.
#
# `gz` is the dirs-only variant: no files in the way when you just want to jump.
# yazi's `shell` cannot change the directory itself, hence `ya emit cd`, which
# talks back to this instance through $YAZI_ID.

[[mgr.prepend_keymap]]
on = ["g", "z"]
run = '''shell --block -- dir="$(fd --type d --hidden --follow --exclude .git --strip-cwd-prefix | fzf)" && [ -n "$dir" ] && ya emit cd "$(realpath -- "$dir")"'''
desc = "Jump to a subdirectory via fzf"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/source"
desc = "Go to ~/source"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd /mnt/photography"
desc = "Go to /mnt/photography"

[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# Swap yazi's quit keys: by default `q` writes --cwd-file (the shell wrapper
# then cds there) and `Q` skips it. Reversed here so plain `q` leaves the
# shell where it was, and `Q` is the deliberate "take me there" exit.
[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Quit, staying in the original directory"

[[mgr.prepend_keymap]]
on = "Q"
run = "quit"
desc = "Quit, cd'ing to the current directory"

# --- Plugins (installed via `ya pkg`, listed in package.toml) ---

# compress.yazi: prompts for a name; the extension picks the format (.zip when
# none is given). Pair to the built-in extract-on-open.
[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

# mount.yazi: m/u/e to mount, unmount, eject; l to enter the mount point.
[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Mount manager"

# restore.yazi: needs trash-cli. Puts back the most recently trashed batch.
[[mgr.prepend_keymap]]
on = "u"
run = "plugin restore"
desc = "Restore last trashed files"

# smart-filter.yazi: filters as you type; Enter on a lone match opens it.
[[mgr.prepend_keymap]]
on = "F"
run = "plugin smart-filter"
desc = "Smart filter"
